apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-experiment
  namespace: chaos-testing
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      app: chaos-target
  delay:
    latency: "500ms"
    jitter: "100ms"
    correlation: "50"
  duration: "2m"
