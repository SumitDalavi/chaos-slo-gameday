apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: target-app
  template:
    metadata:
      labels:
        app: target-app
    spec:
      containers:
      - name: app
        image: nginx:alpine
        ports:
        - containerPort: 80
