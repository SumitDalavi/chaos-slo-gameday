apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-target
  labels:
    app: chaos-target
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chaos-target
  template:
    metadata:
      labels:
        app: chaos-target
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: chaos-target-app:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chaos-target
spec:
  selector:
    app: chaos-target
  ports:
    - port: 80
      targetPort: 3000
